<!DOCTYPE html>
<html>

<head>
<title>Singh Photostat Online Shop</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<h1>हमारे प्रोडक्ट</h1>

<div class="card">

<h3>A4 Paper Pack</h3>
<img src="paper.jpg" alt="A4 Paper">

<p>अच्छी क्वालिटी का प्रिंटिंग पेपर</p>

<p>Price: ₹250</p>

<a href="https://wa.me/918650515172">
Order on WhatsApp
</a>

</div>


<div class="card">

<h3>File Folder</h3>
<img src="file.jpg" alt="File Folder">

<p>ऑफिस और डॉक्यूमेंट के लिए</p>

<p>Price: ₹20</p>

<a href="https://wa.me/918650515172">
Order on WhatsApp
</a>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
    getFirestore,
    collection,
    getDocs
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


const firebaseConfig = {

    apiKey: "AIzaSyCCJcM_Ngo8O0KR6PGoDqEfubvyQ0NScF4",

    authDomain: "singh-photostat.firebaseapp.com",

    projectId: "singh-photostat",

    storageBucket: "singh-photostat.firebasestorage.app",

    messagingSenderId: "366679751413",

    appId: "1:366679751413:web:e8fa0ce97cca7ddfefa3bc"

};


const app = initializeApp(firebaseConfig);

const db = getFirestore(app);


async function loadProducts() {

    try {

        const querySnapshot =
            await getDocs(
                collection(db, "products")
            );


        querySnapshot.forEach(function(documentSnapshot) {

            const product =
                documentSnapshot.data();


            const productCard = document.createElement("div");

            productCard.className = "card";


            productCard.innerHTML = `

                <h3>${product.name}</h3>

                <p>${product.description}</p>

                <p>
                    <strong>Price: ₹${product.price}</strong>
                </p>

                <a
                    href="https://wa.me/918650515172?text=${encodeURIComponent(
                        "मुझे " + product.name + " चाहिए।"
                    )}"
                    target="_blank">

                    Order on WhatsApp

                </a>

            `;


            document.body.appendChild(productCard);

        });


    } catch (error) {

        console.error(
            "Products load failed:",
            error
        );

    }

}


loadProducts();

</script>
</body>

</html>
