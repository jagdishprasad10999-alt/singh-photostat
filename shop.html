<!DOCTYPE html>
<html>

<head>
<title>Singh Photostat Online Shop</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<h1>हमारे प्रोडक्ट</h1>






<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
    getFirestore,
    collection,
    getDocs
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


const firebaseConfig = {

    apiKey: "AIzaSyCCJcM_Ngo8O0KR6PGoDqEfubvyQ0NScF4",

    authDomain: "singh-photostat.firebaseapp.com",

    projectId: "singh-photostat",

    storageBucket: "singh-photostat.firebasestorage.app",

    messagingSenderId: "366679751413",

    appId: "1:366679751413:web:e8fa0ce97cca7ddfefa3bc"

};


const app = initializeApp(firebaseConfig);

const db = getFirestore(app);


async function loadProducts() {

    try {

        const querySnapshot =
            await getDocs(
                collection(db, "products")
            );


        querySnapshot.forEach(function(documentSnapshot) {

            const product =
                documentSnapshot.data();


            const productCard = document.createElement("div");

            productCard.className = "card";


            productCard.innerHTML = `

                <h3>${product.name}</h3>

                <p>${product.description}</p>

                <p>
                    <strong>Price: ₹${product.price}</strong>
                </p>

                <a
    href="order.html?product=${encodeURIComponent(product.name)}&price=${encodeURIComponent(product.price)}">

    Order Now

</a>

            `;


            document.body.appendChild(productCard);

        });


    } catch (error) {

        console.error(
            "Products load failed:",
            error
        );

    }

}


loadProducts();

</script>
</body>

</html>
