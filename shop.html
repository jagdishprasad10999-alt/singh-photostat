<!DOCTYPE html>
<html>

<head>
<title>Singh Photostat Online Shop</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<h1>हमारे प्रोडक्ट</h1>

<div class="card">

<h3>A4 Paper Pack</h3>
<img src="paper.jpg" alt="A4 Paper">

<p>अच्छी क्वालिटी का प्रिंटिंग पेपर</p>

<p>Price: ₹250</p>

<a href="https://wa.me/918650515172">
Order on WhatsApp
</a>

</div>


<div class="card">

<h3>File Folder</h3>
<img src="file.jpg" alt="File Folder">

<p>ऑफिस और डॉक्यूमेंट के लिए</p>

<p>Price: ₹20</p>

<a href="https://wa.me/918650515172">
Order on WhatsApp
</a>

</div>

<script>

let products = JSON.parse(localStorage.getItem("products")) || [];

products.forEach(function(product){

document.body.innerHTML += `

<div class="card">

<h3>${product.name}</h3>

<p>${product.description}</p>

<img src="${product.image}" width="200">

<p>Price: ₹${product.price}</p>

<a href="order.html?product=${encodeURIComponent(product.name)}&price=${encodeURIComponent(product.price)}">
Order Now
</a>

</div>

`;

});

</script>
</body>

</html>
