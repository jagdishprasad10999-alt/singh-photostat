<!DOCTYPE html>
<html>

<head>

    <title>Admin Login - Singh Photostat</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>
<h1>Admin Login</h1>

<div class="card">

    <h3>Singh Photostat & Janseva Kendra</h3>

    <label>Email:</label>
    <br>
    <input type="email" id="email">

    <br><br>

    <label>Password:</label>
    <br>
    <input type="password" id="password">

    <br><br>

    <button onclick="login()">
        Login
    </button>

</div>
<script type="module">


import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
    getAuth,
    signInWithEmailAndPassword,
    setPersistence,
    browserLocalPersistence
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


const firebaseConfig = {
    apiKey: "AIzaSyDbPCgkkdmLYzgmZnE2JequK6x4Ro8y5k",
    authDomain: "singh-photostat.firebaseapp.com",
    projectId: "singh-photostat",
    storageBucket: "singh-photostat.firebasestorage.app",
    messagingSenderId: "366679751413",
    appId: "1:366679751413:web:e8fa0ce97cca7ddfefa3bc"
};


const app = initializeApp(firebaseConfig);

const auth = getAuth(app);


window.login = function () {

    const email =
        document.getElementById("email").value;

    const password =
        document.getElementById("password").value;


    setPersistence(auth, browserLocalPersistence)

    .then(() => {

        return signInWithEmailAndPassword(
            auth,
            email,
            password
        );

    })

    .then(() => {

        alert("Login Successful");

        window.location.href = "admin.html";

    })

    .catch((error) => {

        alert("Login Failed: " + error.message);

    });

};

</script>

</script>


<script>

    let username = document.getElementById("username").value;

    let password = document.getElementById("password").value;


    if(username === "admin" && password === "1234"){

        window.location.href = "admin.html";

    }
    else{

        alert("Wrong Username or Password");

    }

</script>

</body>

</html>
