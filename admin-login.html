<!DOCTYPE html>
<html>

<head>

    <title>Admin Login - Singh Photostat</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>

    <h1>Admin Login</h1>

    <div class="card">

        <h3>Singh Photostat & Janseva Kendra</h3>

        <label>Email:</label>
        <br>

        <input type="email" id="email">

        <br><br>

        <label>Password:</label>
        <br>

        <input type="password" id="password">

        <br><br>

        <button id="loginButton">
            Login
        </button>

        <button id="forgotButton" type="button"
                style="margin-top:10px;">
            Forgot Password?
        </button>

    </div>


    <script type="module">

        import { initializeApp }
        from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


        import {
            getAuth,
            signInWithEmailAndPassword,
            sendPasswordResetEmail,
            setPersistence,
            browserSessionPersistence
        }
        from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


        const firebaseConfig = {

            apiKey: "AIzaSyCCJcM_Ngo8O0KR6PGoDqEfubvyQ0NScF4",

            authDomain: "singh-photostat.firebaseapp.com",

            projectId: "singh-photostat",

            storageBucket: "singh-photostat.firebasestorage.app",

            messagingSenderId: "366679751413",

            appId: "1:366679751413:web:e8fa0ce97cca7ddfefa3bc"

        };


        const app = initializeApp(firebaseConfig);

        const auth = getAuth(app);


        document.getElementById("loginButton")
        .addEventListener("click", function () {


            const email =
                document.getElementById("email").value.trim();


            const password =
                document.getElementById("password").value;


            if (!email || !password) {

                alert("Please enter Email and Password.");

                return;

            }


            setPersistence(
                auth,
                browserSessionPersistence
            )

            .then(function () {

                return signInWithEmailAndPassword(
                    auth,
                    email,
                    password
                );

            })

            .then(function () {

                sessionStorage.setItem("adminAuthenticated", "true");

                alert("Login Successful");

                window.location.href = "admin.html";

            })

            .catch(function (error) {

                sessionStorage.removeItem("adminAuthenticated");

                console.error(error);

                alert(
                    "Login Failed: " +
                    error.code +
                    "\n" +
                    error.message
                );

            });

        });

        document.getElementById("forgotButton")
        .addEventListener("click", function () {

            const email =
                document.getElementById("email").value.trim();

            if (!email) {
                alert("Please enter your registered Admin Email first.");
                return;
            }

            sendPasswordResetEmail(auth, email)
                .then(function () {
                    alert("Password reset link has been sent to your registered email.");
                })
                .catch(function (error) {
                    console.error(error);
                    alert("Password reset failed: " + error.message);
                });
        });

    </script>


</body>

</html>
