<!DOCTYPE html>
<html>

<head>
<title>Product Admin - Singh Photostat</title>
<link rel="stylesheet" href="style.css">
</head>

<body style="display:none;">

<h1>Product Admin Panel</h1>

<div class="card">

<h3>नया Product जोड़ें</h3>

<label>Product Name:</label>
<br>
<input type="text" id="productName">

<br><br>

<label>Price:</label>
<br>
<input type="text" id="productPrice">

<br><br>

<label>Description:</label>
<br>
<input type="text" id="productDescription">
<br><br>

<label>Product Image:</label>
<br>
<input type="file" id="productImage" accept="image/*">



<br><br>

<button onclick="saveProduct()">
Save Product
</button>
<h2>Added Products</h2>

<div id="productList"></div>
</div>


<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
    getAuth,
    onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import {
    getFirestore,
    collection,
    addDoc,
    getDocs,
    deleteDoc,
    doc,
    updateDoc,
    serverTimestamp
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


const firebaseConfig = {

    apiKey: "AIzaSyCCJcM_Ngo8O0KR6PGoDqEfubvyQ0NScF4",

    authDomain: "singh-photostat.firebaseapp.com",

    projectId: "singh-photostat",

    storageBucket: "singh-photostat.firebasestorage.app",

    messagingSenderId: "366679751413",

    appId: "1:366679751413:web:e8fa0ce97cca7ddfefa3bc"

};


const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getFirestore(app);


/* CHECK ADMIN LOGIN */

onAuthStateChanged(auth, function(user) {

    if (user) {

        console.log("Admin logged in:", user.email);

        document.body.style.display = "block";

        showProducts();

    } else {

        window.location.replace("admin-login.html");

    }

});


/* SAVE PRODUCT */

window.saveProduct = async function() {

    const name =
        document.getElementById("productName").value.trim();

    const price =
        document.getElementById("productPrice").value.trim();

    const description =
        document.getElementById("productDescription").value.trim();

    const imageFile =
        document.getElementById("productImage").files[0];


    if (!name || !price || !description) {

        alert("Please fill all product details.");

        return;

    }


    let imageData = "no-image";


    if (imageFile) {

        const reader = new FileReader();

        reader.onload = async function() {

            imageData = reader.result;

            await addProductToFirestore(
                name,
                price,
                description,
                imageData
            );

        };

        reader.readAsDataURL(imageFile);

    } else {

        await addProductToFirestore(
            name,
            price,
            description,
            imageData
        );

    }

};


/* ADD PRODUCT TO FIRESTORE */

async function addProductToFirestore(
    name,
    price,
    description,
    image
) {

    try {

        await addDoc(
            collection(db, "products"),
            {

                name: name,

                price: Number(price),

                description: description,

                image: image,

                createdAt: serverTimestamp()

            }
        );


        alert("Product Saved Successfully");


        document.getElementById("productName").value = "";

        document.getElementById("productPrice").value = "";

        document.getElementById("productDescription").value = "";

        document.getElementById("productImage").value = "";


        showProducts();


    } catch (error) {

        console.error(error);

        alert("Product save failed: " + error.message);

    }

}


/* SHOW PRODUCTS */

async function showProducts() {

    const list =
        document.getElementById("productList");


    if (!list) {

        console.error("productList not found");

        return;

    }


    list.innerHTML = "<p>Loading products...</p>";


    try {

        const querySnapshot =
            await getDocs(
                collection(db, "products")
            );


        list.innerHTML = "";


        if (querySnapshot.empty) {

            list.innerHTML =
                "<p>No products added yet.</p>";

            return;

        }


        querySnapshot.forEach(function(documentSnapshot) {

            const product =
                documentSnapshot.data();

            const id =
                documentSnapshot.id;


            list.innerHTML += `

                <div class="card">

                    <h3>${product.name}</h3>

                    <p>
                        Price: ₹${product.price}
                    </p>

                    <p>
                        ${product.description}
                    </p>

                    ${
                        product.image &&
                        product.image !== "no-image"

                        ?

                        `<img
                            src="${product.image}"
                            width="150"
                        >`

                        :

                        `<p>No image</p>`
                    }


                    <br><br>

                    <button
                        onclick="editProduct('${id}')">
                        Edit
                    </button>


                    <button
                        onclick="deleteProduct('${id}')">
                        Delete
                    </button>

                </div>

            `;

        });


    } catch (error) {

        console.error(error);

        list.innerHTML =
            "<p>Products load failed.</p>";

        alert(
            "Products load failed: "
            + error.message
        );

    }

}


/* DELETE PRODUCT */

window.deleteProduct = async function(id) {

    if (!confirm("Delete this product?")) {

        return;

    }


    try {

        await deleteDoc(
            doc(db, "products", id)
        );


        alert("Product Deleted Successfully");

        showProducts();


    } catch (error) {

        console.error(error);

        alert(
            "Delete failed: "
            + error.message
        );

    }

};


/* EDIT PRODUCT */

window.editProduct = async function(id) {

    try {

        const newName =
            prompt("Enter new Product Name:");

        if (!newName) return;


        const newPrice =
            prompt("Enter new Price:");

        if (!newPrice) return;


        const newDescription =
            prompt("Enter new Description:");

        if (!newDescription) return;


        await updateDoc(
            doc(db, "products", id),
            {

                name: newName,

                price: Number(newPrice),

                description: newDescription

            }
        );


        alert("Product Updated Successfully");

        showProducts();


    } catch (error) {

        console.error(error);

        alert(
            "Update failed: "
            + error.message
        );

    }

};

</script>


</body>

</html>
