<!DOCTYPE html>
<html>

<head>
<title>Product Admin - Singh Photostat</title>
<link rel="stylesheet" href="style.css">

<style>
*{box-sizing:border-box}
body{margin:0!important;font-family:Arial,"Noto Sans Devanagari",sans-serif!important;background:#f4f8fd!important;color:#163a70!important}
.topbar{background:#062f6b;color:#fff;padding:15px 5%;display:flex;justify-content:space-between;align-items:center;gap:16px;box-shadow:0 3px 12px rgba(0,0,0,.15)}
.brand{font-size:21px;font-weight:800}.brand span{color:#ff7a00}
.topbar a{color:#fff;text-decoration:none;background:#ff7a00;padding:10px 16px;border-radius:8px;font-weight:700}
.container{width:min(1180px,92%);margin:28px auto 50px}
.hero{background:linear-gradient(135deg,#062f6b,#125ba8);color:#fff;border-radius:18px;padding:28px 30px;margin-bottom:24px;box-shadow:0 8px 24px rgba(4,45,104,.18)}
.hero h1{margin:0 0 7px;font-size:30px}.hero p{margin:0;color:#eaf2ff}
.layout{display:grid;grid-template-columns:350px 1fr;gap:24px;align-items:start}
.panel{background:#fff;border:1px solid #dbe5f2;border-radius:16px;padding:23px;box-shadow:0 5px 18px rgba(20,55,100,.08)}
.panel h2{margin:0 0 19px;color:#062f6b;font-size:21px}
.form-group{margin-bottom:15px}
label{display:block;font-weight:700;margin-bottom:7px;color:#28466f}
input[type=text],input[type=number],input[type=file]{width:100%;padding:11px;border:1px solid #cbd8e8;border-radius:9px;font-size:14px;background:#fbfdff}
input:focus{outline:none;border-color:#1769c2;box-shadow:0 0 0 3px rgba(23,105,194,.12)}
button{border:0!important;border-radius:8px!important;padding:10px 14px!important;font-weight:700!important;cursor:pointer!important}
.btn-save{width:100%;background:#ff7a00!important;color:#fff!important}
.list-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:10px}
.count{background:#e8f1ff;color:#0b4d9b;padding:7px 11px;border-radius:20px;font-weight:700;font-size:13px}
#productList{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:17px}
.product-card{background:#fff;border:1px solid #dbe5f2;border-radius:14px;overflow:hidden;box-shadow:0 4px 14px rgba(20,55,100,.07)}
.product-image{height:175px;background:#f2f6fb;display:flex;align-items:center;justify-content:center;overflow:hidden}
.product-image img{width:100%;height:100%;object-fit:contain}
.product-info{padding:15px}.product-info h3{margin:0 0 6px;color:#062f6b;font-size:18px}
.product-info p{color:#687991;min-height:35px}.price{font-size:20px;font-weight:800;color:#16833f;margin:9px 0 12px}
.badge{display:inline-block;padding:5px 9px;border-radius:20px;font-size:12px;font-weight:800;margin-bottom:10px}
.badge.pin{background:#fff0d8;color:#d46c00}.badge.no-pin{background:#edf2f8;color:#66758b}
.actions{display:flex;flex-wrap:wrap;gap:7px}.edit{background:#edf4ff!important;color:#0b4d9b!important}.delete{background:#d9363e!important;color:#fff!important}.pin{background:#0b57b7!important;color:#fff!important}.unpin{background:#159447!important;color:#fff!important}
.empty,.loading{grid-column:1/-1;text-align:center;padding:40px 20px;color:#71819a;background:#fbfdff;border:2px dashed #cbd9ea;border-radius:14px}
.footer{text-align:center;color:#7a899f;font-size:13px;margin-top:28px}
@media(max-width:900px){.layout{grid-template-columns:1fr}#productList{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:620px){.container{width:94%}.hero{padding:22px}.hero h1{font-size:25px}#productList{grid-template-columns:1fr}.topbar{padding:12px 4%}.brand{font-size:17px}}
</style>
</head>

<body style="display:none;">
<header class="topbar">
  <div class="brand">Singh Photostat & <span>Jan Seva Kendra</span></div>
  <a href="admin.html">← Admin Panel</a>
</header>
<main class="container">
<section class="hero">
  <h1>🛍️ Product Management</h1>
  <p>Products जोड़ें, image देखें, edit/delete करें और Home Page पर अधिकतम 3 products pin करें।</p>
</section>
<div class="layout">

<section class="panel">
  <h2>➕ नया Product जोड़ें</h2>
  <div class="form-group"><label for="productName">Product Name</label><input type="text" id="productName" placeholder="जैसे Pen Drive 32GB"></div>
  <div class="form-group"><label for="productPrice">Price (₹)</label><input type="number" id="productPrice" min="0" placeholder="250"></div>
  <div class="form-group"><label for="productDescription">Description</label><input type="text" id="productDescription" placeholder="High Speed"></div>
  <div class="form-group"><label for="productImage">Product Image</label><input type="file" id="productImage" accept="image/*"></div>
  <button class="btn-save" onclick="saveProduct()">💾 Save Product</button>
</section>
<section class="panel">
  <div class="list-head"><h2 style="margin:0">📦 Added Products</h2><span class="count" id="productCount">0 Products</span></div>
  <div id="productList"><div class="loading">Products loading...</div></div>
</section>
</div>
<div class="footer">Singh Photostat & Jan Seva Kendra • Product Admin</div>
</main>
<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
    getAuth,
    onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import {
    getFirestore,
    collection,
    addDoc,
    getDocs,
    deleteDoc,
    doc,
    updateDoc,
    serverTimestamp
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


const firebaseConfig = {

    apiKey: "AIzaSyCCJcM_Ngo8O0KR6PGoDqEfubvyQ0NScF4",

    authDomain: "singh-photostat.firebaseapp.com",

    projectId: "singh-photostat",

    storageBucket: "singh-photostat.firebasestorage.app",

    messagingSenderId: "366679751413",

    appId: "1:366679751413:web:e8fa0ce97cca7ddfefa3bc"

};


const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getFirestore(app);


/* CHECK ADMIN LOGIN */

onAuthStateChanged(auth, function(user) {

    if (user) {

        console.log("Admin logged in:", user.email);

        document.body.style.display = "block";

        showProducts();

    } else {

        window.location.replace("admin-login.html");

    }

});


/* SAVE PRODUCT */

window.saveProduct = async function() {

    const name =
        document.getElementById("productName").value.trim();

    const price =
        document.getElementById("productPrice").value.trim();

    const description =
        document.getElementById("productDescription").value.trim();

    const imageFile =
        document.getElementById("productImage").files[0];


    if (!name || !price || !description) {

        alert("Please fill all product details.");

        return;

    }


    let imageData = "no-image";


    if (imageFile) {

        const reader = new FileReader();

        reader.onload = async function() {

            imageData = reader.result;

            await addProductToFirestore(
                name,
                price,
                description,
                imageData
            );

        };

        reader.readAsDataURL(imageFile);

    } else {

        await addProductToFirestore(
            name,
            price,
            description,
            imageData
        );

    }

};


/* ADD PRODUCT TO FIRESTORE */

async function addProductToFirestore(
    name,
    price,
    description,
    image
) {

    try {

        await addDoc(
            collection(db, "products"),
    {
    name: name,
    price: Number(price),
    description: description,
    image: image,
    pinned: false,
    createdAt: serverTimestamp()
}
        );


        alert("Product Saved Successfully");


        document.getElementById("productName").value = "";

        document.getElementById("productPrice").value = "";

        document.getElementById("productDescription").value = "";

        document.getElementById("productImage").value = "";


        showProducts();


    } catch (error) {

        console.error(error);

        alert("Product save failed: " + error.message);

    }

}


/* SHOW PRODUCTS */

async function showProducts() {

    const list =
        document.getElementById("productList");


    if (!list) {

        console.error("productList not found");

        return;

    }


    list.innerHTML = "<p>Loading products...</p>";


    try {

        const querySnapshot =
            await getDocs(
                collection(db, "products")
            );


        list.innerHTML = "";


        if (querySnapshot.empty) {

            list.innerHTML =
                "<p>No products added yet.</p>";

            return;

        }


        querySnapshot.forEach(function(documentSnapshot) {

            const product =
                documentSnapshot.data();

            const id =
                documentSnapshot.id;


            list.innerHTML += `

                <article class="product-card">
  <div class="product-image">
    ${
      product.image && product.image !== "no-image"
      ? `<img src="${product.image}" alt="${product.name}">`
      : `<div>No Image</div>`
    }
  </div>
  <div class="product-info">
    <span class="badge ${product.pinned === true ? "pin" : "no-pin"}">
      ${product.pinned === true ? "📌 Pinned to Home" : "Not Pinned"}
    </span>
    <h3>${product.name}</h3>
    <p>${product.description}</p>
    <div class="price">₹${product.price}</div>
    <div class="actions">
      <button class="edit" onclick="editProduct('${id}')">✏️ Edit</button>
      <button class="delete" onclick="deleteProduct('${id}')">🗑️ Delete</button>
      <button class="${product.pinned === true ? "unpin" : "pin"}" onclick="toggleProductPin('${id}', ${product.pinned === true})">
        ${product.pinned === true ? "📌 Unpin" : "📌 Pin to Home"}
      </button>
    </div>
  </div>
</article>

            `;

        });


    } catch (error) {

        console.error(error);

        list.innerHTML =
            "<p>Products load failed.</p>";

        alert(
            "Products load failed: "
            + error.message
        );

    }

}


/* DELETE PRODUCT */

window.deleteProduct = async function(id) {

    if (!confirm("Delete this product?")) {

        return;

    }


    try {

        await deleteDoc(
            doc(db, "products", id)
        );


        alert("Product Deleted Successfully");

        showProducts();


    } catch (error) {

        console.error(error);

        alert(
            "Delete failed: "
            + error.message
        );

    }

};


/* EDIT PRODUCT */

window.editProduct = async function(id) {

    try {

        const newName =
            prompt("Enter new Product Name:");

        if (!newName) return;


        const newPrice =
            prompt("Enter new Price:");

        if (!newPrice) return;


        const newDescription =
            prompt("Enter new Description:");

        if (!newDescription) return;


        await updateDoc(
            doc(db, "products", id),
            {

                name: newName,

                price: Number(newPrice),

                description: newDescription

            }
        );


        alert("Product Updated Successfully");

        showProducts();


    } catch (error) {

        console.error(error);

        alert(
            "Update failed: "
            + error.message
        );

    }

};

/* =========================
   PIN / UNPIN PRODUCT
========================= */

window.toggleProductPin = async function(id, currentlyPinned) {

    try {

        // अगर product पहले से pinned है
        // तो सीधे unpin करें

        if (currentlyPinned) {

            await updateDoc(

                doc(db, "products", id),

                {
                    pinned: false
                }

            );

            alert("Product Unpinned Successfully");

            showProducts();

            return;
        }


        // सभी products check करें

        const querySnapshot =
            await getDocs(
                collection(db, "products")
            );


        let pinnedCount = 0;


        querySnapshot.forEach(
            function(documentSnapshot) {

                const product =
                    documentSnapshot.data();


                if (product.pinned === true) {

                    pinnedCount++;

                }

            }
        );


        // Maximum 3 pinned products

        if (pinnedCount >= 3) {

            alert(
                "Home Page पर अधिकतम 3 products ही pin किए जा सकते हैं। पहले किसी product को Unpin करें।"
            );

            return;

        }


        // Product को pin करें

        await updateDoc(

            doc(db, "products", id),

            {
                pinned: true
            }

        );


        alert("Product Pinned to Home Successfully");

        showProducts();


    }

    catch(error) {

        console.error(error);

        alert(
            "Pin/Unpin failed: "
            + error.message
        );

    }

};

</script>


</body>

</html>
