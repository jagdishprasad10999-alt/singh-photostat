<!DOCTYPE html>
<html>

<head>
<title>Product Admin - Singh Photostat</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<h1>Product Admin Panel</h1>

<div class="card">

<h3>नया Product जोड़ें</h3>

<label>Product Name:</label>
<br>
<input type="text" id="productName">

<br><br>

<label>Price:</label>
<br>
<input type="text" id="productPrice">

<br><br>

<label>Description:</label>
<br>
<input type="text" id="productDescription">
<br><br>

<label>Product Image:</label>
<br>
<input type="file" id="productImage" accept="image/*">



<br><br>

<button onclick="saveProduct()">
Save Product
</button>
<h2>Added Products</h2>

<div id="productList"></div>
</div>


<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
    getFirestore,
    collection,
    addDoc,
    getDocs,
    updateDoc,
    deleteDoc,
    doc
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

import {
    getAuth,
    onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


const firebaseConfig = {
    apiKey: "AIzaSyDbPCgkkdmLYzgmZnE2JequK6x4Ro8y5k",
    authDomain: "singh-photostat.firebaseapp.com",
    projectId: "singh-photostat",
    storageBucket: "singh-photostat.firebasestorage.app",
    messagingSenderId: "366679751413",
    appId: "1:366679751413:web:e8fa0ce97cca7ddfefa3bc"
};


const app = initializeApp(firebaseConfig);

const db = getFirestore(app);

const auth = getAuth(app);


let currentUser = null;


// Check Admin Login
onAuthStateChanged(auth, function(user){

    if(!user){

        alert("Please login as Admin first.");

        window.location.href = "admin-login.html";

        return;

    }

    currentUser = user;

    showProducts();

});


// Compress Image
function compressImage(file){

    return new Promise(function(resolve){

        let reader = new FileReader();

        reader.onload = function(event){

            let img = new Image();

            img.onload = function(){

                let canvas = document.createElement("canvas");

                let maxWidth = 500;

                let scale = Math.min(
                    maxWidth / img.width,
                    maxWidth / img.height,
                    1
                );

                canvas.width = img.width * scale;

                canvas.height = img.height * scale;

                let ctx = canvas.getContext("2d");

                ctx.drawImage(
                    img,
                    0,
                    0,
                    canvas.width,
                    canvas.height
                );

                let compressedImage =
                    canvas.toDataURL("image/jpeg", 0.6);

                resolve(compressedImage);

            };

            img.src = event.target.result;

        };

        reader.readAsDataURL(file);

    });

}


// Save Product
window.saveProduct = async function(){

    let name =
        document.getElementById("productName").value.trim();

    let price =
        document.getElementById("productPrice").value.trim();

    let description =
        document.getElementById("productDescription").value.trim();

    let imageFile =
        document.getElementById("productImage").files[0];


    if(!name || !price || !description){

        alert("Please fill all product details.");

        return;

    }


    if(!imageFile){

        alert("Please select a product image.");

        return;

    }


    try{

        let image = await compressImage(imageFile);


        await addDoc(
            collection(db, "products"),
            {
                name: name,
                price: Number(price),
                description: description,
                image: image,
                createdAt: new Date()
            }
        );


        alert("Product Saved Successfully");


        document.getElementById("productName").value = "";

        document.getElementById("productPrice").value = "";

        document.getElementById("productDescription").value = "";

        document.getElementById("productImage").value = "";


        showProducts();

    }
    catch(error){

        console.error(error);

        alert("Product Save Failed: " + error.message);

    }

};


// Show Products
window.showProducts = async function(){

    let list =
        document.getElementById("productList");

    list.innerHTML = "Loading Products...";


    try{

        let querySnapshot =
            await getDocs(collection(db, "products"));


        list.innerHTML = "";


        querySnapshot.forEach(function(documentSnapshot){

            let product =
                documentSnapshot.data();

            let id =
                documentSnapshot.id;


            list.innerHTML += `

                <div class="card">

                    <h3>${product.name}</h3>

                    <p>Price: ₹${product.price}</p>

                    <p>${product.description}</p>

                    ${
                        product.image
                        ?
                        `<img src="${product.image}" width="150">`
                        :
                        ""
                    }

                    <br><br>

                    <button onclick="editProduct('${id}')">
                        Edit
                    </button>

                    <button onclick="deleteProduct('${id}')">
                        Delete
                    </button>

                </div>

            `;

        });


        if(list.innerHTML === ""){

            list.innerHTML = "No products added yet.";

        }

    }
    catch(error){

        console.error(error);

        list.innerHTML =
            "Products load failed: " + error.message;

    }

};


// Delete Product
window.deleteProduct = async function(id){

    let confirmDelete =
        confirm("Are you sure you want to delete this product?");


    if(!confirmDelete){

        return;

    }


    try{

        await deleteDoc(
            doc(db, "products", id)
        );


        alert("Product Deleted Successfully");

        showProducts();

    }
    catch(error){

        console.error(error);

        alert("Delete Failed: " + error.message);

    }

};


// Edit Product
window.editProduct = async function(id){

    try{

        let productDoc =
            doc(db, "products", id);

        let querySnapshot =
            await getDocs(collection(db, "products"));


        let product = null;


        querySnapshot.forEach(function(documentSnapshot){

            if(documentSnapshot.id === id){

                product =
                    documentSnapshot.data();

            }

        });


        if(!product){

            alert("Product not found.");

            return;

        }


        let name =
            prompt("Product Name", product.name);

        if(name === null){

            return;

        }


        let price =
            prompt("Price", product.price);

        if(price === null){

            return;

        }


        let description =
            prompt(
                "Description",
                product.description
            );

        if(description === null){

            return;

        }


        await updateDoc(
            productDoc,
            {
                name: name,
                price: Number(price),
                description: description
            }
        );


        alert("Product Updated Successfully");

        showProducts();

    }
    catch(error){

        console.error(error);

        alert("Edit Failed: " + error.message);

    }

};

</script>


</body>

</html>
