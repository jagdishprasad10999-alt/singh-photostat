<!DOCTYPE html>
<html>

<head>

    <title>Admin Panel - Singh Photostat</title>

    <link rel="stylesheet" href="style.css">

</head>


<body style="display:none;">


<h1>Admin Panel</h1>


<!-- =========================
     FORM MANAGEMENT
========================= -->

<div class="card">

    <h3>नया फॉर्म जोड़ें</h3>


    <label>फॉर्म का नाम:</label>
    <br>

    <input type="text" id="formName">


    <br><br>


    <label>अंतिम तारीख:</label>
    <br>

    <input type="text" id="formDate">


    <br><br>


    <label>सरकारी फीस:</label>
    <br>

    <input type="text" id="formGovtFee">


    <br><br>


    <label>फीस:</label>
    <br>

    <input type="text" id="formServiceFee">


    <br><br>


    <label>Remark:</label>
    <br>

    <input
        type="text"
        id="formRemark"
        placeholder="Additional information">


    <br><br>


    <button onclick="saveForm()">
        Save Form
    </button>


    <h2>Added Forms</h2>


    <div id="formList"></div>

</div>



<br><br>



<!-- =========================
     SERVICE MANAGEMENT
========================= -->

<div class="card">

    <h2>Manage Services</h2>


    <label>Service चुनें:</label>

    <br><br>


    <select id="serviceSelect">

        <option value="photoPrinting">
            फोटो और प्रिंटिंग
        </option>

        <option value="laminationCards">
            लैमिनेशन, कार्ड और Accessories
        </option>

        <option value="janSeva">
            जन सेवा केंद्र
        </option>

        <option value="kisanSeva">
            किसान सेवाएँ
        </option>

    </select>


    <br><br>


    <label>Description:</label>

    <br>

    <input
        type="text"
        id="serviceDescription"
        placeholder="Service description">


    <br><br>


    <label>Price:</label>

    <br>

    <input
        type="text"
        id="servicePrice"
        placeholder="₹ Price">


    <br><br>


    <label>Remark:</label>

    <br>

    <input
        type="text"
        id="serviceRemark"
        placeholder="Additional information">


    <br><br>


    <button onclick="saveServiceItem()">
        Add Service Item
    </button>


    <h2>Added Service Items</h2>


    <div id="serviceList"></div>

</div>



<br><br>



<!-- =========================
     PRODUCT MANAGEMENT
========================= -->

<a href="product-admin.html">

    <button>
        Manage Products
    </button>

</a>



<script type="module">


import { initializeApp }

from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";



import {

    getAuth,
    onAuthStateChanged

}

from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";



import {

    getFirestore,
    collection,
    addDoc,
    getDocs,
    doc,
    updateDoc,
    deleteDoc

}

from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";



const firebaseConfig = {

    apiKey:
        "AIzaSyCCJcM_Ngo8O0KR6PGoDqEfubvyQ0NScF4",

    authDomain:
        "singh-photostat.firebaseapp.com",

    projectId:
        "singh-photostat",

    storageBucket:
        "singh-photostat.firebasestorage.app",

    messagingSenderId:
        "366679751413",

    appId:
        "1:366679751413:web:e8fa0ce97cca7ddfefa3bc"

};



const app =
    initializeApp(firebaseConfig);


const auth =
    getAuth(app);


const db =
    getFirestore(app);




/* =========================
   SAVE FORM
========================= */


window.saveForm = async function() {


    const newForm = {

        name:
            document.getElementById("formName").value.trim(),

        date:
            document.getElementById("formDate").value.trim(),

        govtFee:
            document.getElementById("formGovtFee").value.trim(),

        serviceFee:
            document.getElementById("formServiceFee").value.trim(),

        remark:
            document.getElementById("formRemark").value.trim(),
        pinned: false
    };


    if (!newForm.name) {

        alert("Please enter Form Name.");

        return;

    }


    try {

        await addDoc(

            collection(db, "forms"),

            newForm

        );


        alert("Form Added Successfully");


        document.getElementById("formName").value = "";

        document.getElementById("formDate").value = "";

        document.getElementById("formGovtFee").value = "";

        document.getElementById("formServiceFee").value = "";

        document.getElementById("formRemark").value = "";


        showForms();


    }

    catch(error) {

        console.error(error);

        alert(
            "Form save failed: "
            + error.message
        );

    }

};




/* =========================
   SHOW FORMS
========================= */


window.showForms = async function() {


    const list =
        document.getElementById("formList");


    list.innerHTML =
        "<p>Loading forms...</p>";


    try {


        const querySnapshot =
            await getDocs(

                collection(db, "forms")

            );


        list.innerHTML = "";


        if (querySnapshot.empty) {

            list.innerHTML =
                "<p>No forms added yet.</p>";

            return;

        }


        let srNo = 1;


        querySnapshot.forEach(

            function(documentSnapshot) {


                const form =
                    documentSnapshot.data();


                const id =
                    documentSnapshot.id;


                list.innerHTML += `

                    <div class="card">

                        <h3>
                            ${srNo}. ${form.name}
                        </h3>

                        <p>
                            अंतिम तारीख:
                            ${form.date}
                        </p>

                        <p>
                            सरकारी फीस:
                            ₹${form.govtFee}
                        </p>

                        <p>
                            फीस:
                            ₹${form.serviceFee}
                        </p>

                        <p>
                            Remark:
                            ${form.remark || "-"}
                        </p>


                        <button
                            onclick="editForm('${id}')">

                            Edit

                        </button>


                        <button
                            onclick="deleteForm('${id}')">

                            Delete

                        </button>

<br><br>

<button
    onclick="toggleFormPin(
        '${id}',
        ${form.pinned === true}
    )">

    ${
        form.pinned === true
        ? "📌 Pinned — Unpin"
        : "📌 Pin to Home"
    }

</button>

                    </div>

                `;


                srNo++;

            }

        );


    }

    catch(error) {

        console.error(error);

        list.innerHTML =
            "<p>Forms load failed.</p>";

    }

};




/* =========================
   DELETE FORM
========================= */


window.deleteForm = async function(id) {


    if (
        !confirm(
            "Are you sure you want to delete this form?"
        )
    ) {

        return;

    }


    try {


        await deleteDoc(

            doc(db, "forms", id)

        );


        alert(
            "Form Deleted Successfully"
        );


        showForms();


    }

    catch(error) {

        console.error(error);

        alert(
            "Delete failed: "
            + error.message
        );

    }

};




/* =========================
   EDIT FORM
========================= */


window.editForm = async function(id) {


    try {


        const querySnapshot =
            await getDocs(

                collection(db, "forms")

            );


        let selectedForm = null;


        querySnapshot.forEach(

            function(documentSnapshot) {


                if (
                    documentSnapshot.id === id
                ) {


                    selectedForm = {

                        id:
                            documentSnapshot.id,

                        ...documentSnapshot.data()

                    };

                }

            }

        );


        if (!selectedForm) {

            alert("Form not found.");

            return;

        }


        const name =
            prompt(
                "Form Name",
                selectedForm.name
            );


        if (name === null) return;


        const date =
            prompt(
                "Last Date",
                selectedForm.date
            );


        if (date === null) return;


        const govtFee =
            prompt(
                "Government Fee",
                selectedForm.govtFee
            );


        if (govtFee === null) return;


        const serviceFee =
            prompt(
                "Service Charge",
                selectedForm.serviceFee
            );


        if (serviceFee === null) return;


        const remark =
            prompt(
                "Remark",
                selectedForm.remark || ""
            );


        if (remark === null) return;


        await updateDoc(

            doc(db, "forms", id),

            {

                name: name,

                date: date,

                govtFee: govtFee,

                serviceFee: serviceFee,

                remark: remark

            }

        );


        alert(
            "Form Updated Successfully"
        );


        showForms();


    }

    catch(error) {

        console.error(error);

        alert(
            "Edit failed: "
            + error.message
        );

    }

};




/* =========================
   SAVE SERVICE ITEM
========================= */


window.saveServiceItem = async function() {


    const serviceId =
        document.getElementById(
            "serviceSelect"
        ).value;


    const description =
        document.getElementById(
            "serviceDescription"
        ).value.trim();


    const price =
        document.getElementById(
            "servicePrice"
        ).value.trim();


    const remark =
        document.getElementById(
            "serviceRemark"
        ).value.trim();


    if (!description) {

        alert(
            "Please enter Description."
        );

        return;

    }


    if (!price) {

        alert(
            "Please enter Price."
        );

        return;

    }


    try {


        await addDoc(

            collection(
                db,
                "services",
                serviceId,
                "items"
            ),

            {

                description: description,

                price: price,

                remark: remark

            }

        );


        alert(
            "Service Item Added Successfully"
        );


        document.getElementById(
            "serviceDescription"
        ).value = "";


        document.getElementById(
            "servicePrice"
        ).value = "";


        document.getElementById(
            "serviceRemark"
        ).value = "";


        showServiceItems();


    }

    catch(error) {

        console.error(error);

        alert(
            "Service save failed: "
            + error.message
        );

    }

};




/* =========================
   SHOW SERVICE ITEMS
========================= */


window.showServiceItems = async function() {


    const serviceId =
        document.getElementById(
            "serviceSelect"
        ).value;


    const list =
        document.getElementById(
            "serviceList"
        );


    list.innerHTML =
        "<p>Loading...</p>";


    try {


        const querySnapshot =
            await getDocs(

                collection(
                    db,
                    "services",
                    serviceId,
                    "items"
                )

            );


        list.innerHTML = "";


        if (querySnapshot.empty) {

            list.innerHTML =
                "<p>No service items added yet.</p>";

            return;

        }


        let srNo = 1;


        querySnapshot.forEach(

            function(documentSnapshot) {


                const item =
                    documentSnapshot.data();


                const id =
                    documentSnapshot.id;


                list.innerHTML += `

                    <div class="card">

                        <h3>
                            ${srNo}.
                            ${item.description}
                        </h3>

                        <p>
                            Price:
                            ₹${item.price}
                        </p>

                        <p>
                            Remark:
                            ${item.remark || "-"}
                        </p>


                        <button
                            onclick="
                                editServiceItem(
                                    '${serviceId}',
                                    '${id}'
                                )
                            ">

                            Edit

                        </button>


                        <button
                            onclick="
                                deleteServiceItem(
                                    '${serviceId}',
                                    '${id}'
                                )
                            ">

                            Delete

                        </button>

                    </div>

                `;


                srNo++;

            }

        );


    }

    catch(error) {

        console.error(error);

        list.innerHTML =
            "<p>Service items load failed.</p>";

    }

};




/* =========================
   EDIT SERVICE ITEM
========================= */


window.editServiceItem =
async function(serviceId, id) {


    try {


        const querySnapshot =
            await getDocs(

                collection(
                    db,
                    "services",
                    serviceId,
                    "items"
                )

            );


        let selectedItem = null;


        querySnapshot.forEach(

            function(documentSnapshot) {


                if (
                    documentSnapshot.id === id
                ) {

                    selectedItem = {

                        ...documentSnapshot.data()

                    };

                }

            }

        );


        if (!selectedItem) {

            alert(
                "Service item not found."
            );

            return;

        }


        const description =
            prompt(
                "Description",
                selectedItem.description
            );


        if (description === null) return;


        const price =
            prompt(
                "Price",
                selectedItem.price
            );


        if (price === null) return;


        const remark =
            prompt(
                "Remark",
                selectedItem.remark || ""
            );


        if (remark === null) return;


        await updateDoc(

            doc(
                db,
                "services",
                serviceId,
                "items",
                id
            ),

            {

                description: description,

                price: price,

                remark: remark

            }

        );


        alert(
            "Service Item Updated Successfully"
        );


        showServiceItems();


    }

    catch(error) {

        console.error(error);

        alert(
            "Update failed: "
            + error.message
        );

    }

};




/* =========================
   DELETE SERVICE ITEM
========================= */


window.deleteServiceItem =
async function(serviceId, id) {


    if (
        !confirm(
            "Delete this service item?"
        )
    ) {

        return;

    }


    try {


        await deleteDoc(

            doc(
                db,
                "services",
                serviceId,
                "items",
                id
            )

        );


        alert(
            "Service Item Deleted Successfully"
        );


        showServiceItems();


    }

    catch(error) {

        console.error(error);

        alert(
            "Delete failed: "
            + error.message
        );

    }

};




/* =========================
   SERVICE SELECTION CHANGE
========================= */


document.getElementById(
    "serviceSelect"
).addEventListener(

    "change",

    function() {

        showServiceItems();

    }

);




/* =========================
   LOGIN CHECK
========================= */


onAuthStateChanged(

    auth,

    function(user) {


        if (user) {


            console.log(
                "Admin logged in:",
                user.email
            );


            document.body.style.display =
                "block";


            showForms();

            showServiceItems();


        }

        else {


            window.location.replace(
                "admin-login.html"
            );

        }

    }

);

/* =========================
   PIN / UNPIN FORM
========================= */

window.toggleFormPin = async function(id, currentlyPinned) {

    try {

        if (currentlyPinned) {

            await updateDoc(

                doc(db, "forms", id),

                {
                    pinned: false
                }

            );

            alert("Form Unpinned Successfully");

            showForms();

            return;
        }


        const querySnapshot =
            await getDocs(
                collection(db, "forms")
            );


        let pinnedCount = 0;


        querySnapshot.forEach(
            function(documentSnapshot) {

                const form =
                    documentSnapshot.data();

                if (form.pinned === true) {

                    pinnedCount++;

                }

            }
        );


        if (pinnedCount >= 3) {

            alert(
                "Home Page पर अधिकतम 3 forms ही pin किए जा सकते हैं। पहले किसी form को Unpin करें।"
            );

            return;

        }


        await updateDoc(

            doc(db, "forms", id),

            {
                pinned: true
            }

        );


        alert("Form Pinned to Home Successfully");

        showForms();


    }

    catch(error) {

        console.error(error);

        alert(
            "Pin/Unpin failed: "
            + error.message
        );

    }

};

</script>


</body>

</html>
