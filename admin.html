<!DOCTYPE html>
<html>
<head>
    <title>Admin Panel - Singh Photostat</title>
    <link rel="stylesheet" href="style.css">
</head>

<body style="display:none;">

<h1>Admin Panel</h1>

<div class="card">

<h3>नया फॉर्म जोड़ें</h3>

<label>फॉर्म का नाम:</label>
<br>
<input type="text">

<br><br>

<label>अंतिम तारीख:</label>
<br>
<input type="text">

<br><br>

<label>सरकारी फीस:</label>
<br>
<input type="text">

<br><br>

<label>फीस:</label>
<br>
<input type="text">

<br><br>

<button onclick="saveForm()">
Save Form
</button>

<h2>Added Forms</h2>

<div id="formList"></div>
</div>

<br><br>

<a href="product-admin.html">
    <button>Manage Products</button>
</a>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
    getAuth,
    onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import {
    getFirestore,
    collection,
    addDoc,
    getDocs,
    doc,
    updateDoc,
    deleteDoc
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


const firebaseConfig = {

    apiKey: "AIzaSyCCJcM_Ngo8O0KR6PGoDqEfubvyQ0NScF4",

    authDomain: "singh-photostat.firebaseapp.com",

    projectId: "singh-photostat",

    storageBucket: "singh-photostat.firebasestorage.app",

    messagingSenderId: "366679751413",

    appId: "1:366679751413:web:e8fa0ce97cca7ddfefa3bc"

};


const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getFirestore(app);


/* =========================
   SAVE FORM
========================= */

window.saveForm = async function() {

    let inputs = document.querySelectorAll("input");

    let newForm = {

        name: inputs[0].value,

        date: inputs[1].value,

        govtFee: inputs[2].value,

        serviceFee: inputs[3].value

    };


    if (!newForm.name) {

        alert("Please enter Form Name.");

        return;

    }


    try {

        await addDoc(
            collection(db, "forms"),
            newForm
        );


        alert("Form Added Successfully");


        inputs.forEach(function(input) {

            input.value = "";

        });


        showForms();


    } catch(error) {

        console.error(error);

        alert(
            "Form save failed: "
            + error.message
        );

    }

};


/* =========================
   SHOW FORMS
========================= */

window.showForms = async function() {

    let list =
        document.getElementById("formList");


    list.innerHTML =
        "<p>Loading forms...</p>";


    try {

        const querySnapshot =
            await getDocs(
                collection(db, "forms")
            );


        list.innerHTML = "";


        if (querySnapshot.empty) {

            list.innerHTML =
                "<p>No forms added yet.</p>";

            return;

        }


        querySnapshot.forEach(function(documentSnapshot) {

            const form =
                documentSnapshot.data();

            const id =
                documentSnapshot.id;


            list.innerHTML += `

                <div class="card">

                    <h3>
                        ${form.name}
                    </h3>

                    <p>
                        अंतिम तारीख:
                        ${form.date}
                    </p>

                    <p>
                        सरकारी फीस:
                        ₹${form.govtFee}
                    </p>

                    <p>
                        फीस:
                        ₹${form.serviceFee}
                    </p>

                    <button
                        onclick="editForm('${id}')">

                        Edit

                    </button>

                    <button
                        onclick="deleteForm('${id}')">

                        Delete

                    </button>

                </div>

            `;

        });


    } catch(error) {

        console.error(error);

        list.innerHTML =
            "<p>Forms load failed.</p>";


        alert(
            "Forms load failed: "
            + error.message
        );

    }

};


/* =========================
   DELETE FORM
========================= */

window.deleteForm = async function(id) {

    if (
        !confirm(
            "Are you sure you want to delete this form?"
        )
    ) {

        return;

    }


    try {

        await deleteDoc(
            doc(db, "forms", id)
        );


        alert("Form Deleted Successfully");


        showForms();


    } catch(error) {

        console.error(error);

        alert(
            "Delete failed: "
            + error.message
        );

    }

};


/* =========================
   EDIT FORM
========================= */

window.editForm = async function(id) {

    try {

        const querySnapshot =
            await getDocs(
                collection(db, "forms")
            );


        let selectedForm = null;


        querySnapshot.forEach(function(documentSnapshot) {

            if (documentSnapshot.id === id) {

                selectedForm = {
                    id: documentSnapshot.id,
                    ...documentSnapshot.data()
                };

            }

        });


        if (!selectedForm) {

            alert("Form not found.");

            return;

        }


        let name =
            prompt(
                "Form Name",
                selectedForm.name
            );


        if (name === null) return;


        let date =
            prompt(
                "Last Date",
                selectedForm.date
            );


        if (date === null) return;


        let govtFee =
            prompt(
                "Government Fee",
                selectedForm.govtFee
            );


        if (govtFee === null) return;


        let serviceFee =
            prompt(
                "Service Charge",
                selectedForm.serviceFee
            );


        if (serviceFee === null) return;


        await updateDoc(

            doc(db, "forms", id),

            {

                name: name,

                date: date,

                govtFee: govtFee,

                serviceFee: serviceFee

            }

        );


        alert("Form Updated Successfully");


        showForms();


    } catch(error) {

        console.error(error);

        alert(
            "Edit failed: "
            + error.message
        );

    }

};


/* =========================
   LOGIN CHECK
========================= */

onAuthStateChanged(auth, function(user) {

    if (user) {

        console.log(
            "Admin logged in:",
            user.email
        );


        document.body.style.display =
            "block";


        showForms();


    } else {

        window.location.replace(
            "admin-login.html"
        );

    }

});

</script>

</body>
</html>
