Save Form

<div id="formList"></div>

    <button>Manage Products</button>

<script>

async function saveForm(){

    let inputs = document.querySelectorAll("input");

    let newForm = {
        name: inputs[0].value,
        date: inputs[1].value,
        govtFee: inputs[2].value,
        serviceFee: inputs[3].value
    };

    try {

        await addDoc(
            collection(db, "forms"),
            newForm
        );

        alert("Form Added Successfully");

        inputs.forEach(function(input){
            input.value = "";
        });

        showForms();

    } catch(error) {

        console.error(error);

        alert("Form save failed: " + error.message);

    }

}

async function showForms(){

    let list = document.getElementById("formList");

    list.innerHTML = "<p>Loading forms...</p>";

    try {

        const querySnapshot =
            await getDocs(
                collection(db, "forms")
            );

        list.innerHTML = "";

        if (querySnapshot.empty) {

            list.innerHTML =
                "<p>No forms added yet.</p>";

            return;
        }

        querySnapshot.forEach(function(documentSnapshot){

            const form =
                documentSnapshot.data();

            const id =
                documentSnapshot.id;

            list.innerHTML += `

                <div class="card">

                    <h3>${form.name}</h3>

                    <p>
                        अंतिम तारीख: ${form.date}
                    </p>

                    <p>
                        सरकारी फीस: ₹${form.govtFee}
                    </p>

                    <p>
                        फीस: ₹${form.serviceFee}
                    </p>

                    <button onclick="editForm('${id}')">
                        Edit
                    </button>

                    <button onclick="deleteForm('${id}')">
                        Delete
                    </button>

                </div>

            `;

        });

    } catch(error) {

        console.error(error);

        list.innerHTML =
            "<p>Forms load failed.</p>";

        alert(
            "Forms load failed: "
            + error.message
        );

    }

}


function deleteForm(index){

let forms = JSON.parse(localStorage.getItem("forms")) || [];

forms.splice(index,1);

localStorage.setItem("forms",JSON.stringify(forms));

showForms();

}

showForms();

function editForm(index){

let forms = JSON.parse(localStorage.getItem("forms")) || [];

let form = forms[index];


let name = prompt("Form Name", form.name);

let date = prompt("Last Date", form.date);

let govtFee = prompt("Government Fee", form.govtFee);

let serviceFee = prompt("Service Charge", form.serviceFee);


forms[index] = {

name:name,
date:date,
govtFee:govtFee,
serviceFee:serviceFee

};


localStorage.setItem("forms", JSON.stringify(forms));


showForms();

}
</script>
